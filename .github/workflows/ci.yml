name: CI

# PR 與 main 上 build 映像檔並跑 E2E（容器＋真的 Postgres）。部署不在這裡，見 release.yml。

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_call: # release.yml 先跑 E2E 再部署

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: high-society:latest
          build-args: |
            VITE_DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          SKIP_DOCKER_BUILD: true
